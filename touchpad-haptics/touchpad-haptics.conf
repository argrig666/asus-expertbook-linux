# touchpad-haptics settings, restored whenever the touchpad appears (boot,
# driver rebind). Everything commented out keeps the firmware defaults.
# Change and save with:  sudo touchpad-haptics set --click-force 2 --intensity 60 --save
#
# How hard a press must be before it clicks: 1 light, 2 medium, 3 firm.
#CLICK_FORCE=2
#
# Strength of the haptic "click" feedback, 0 (off) to 100.
#HAPTIC_INTENSITY=60

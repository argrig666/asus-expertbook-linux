PACKAGE_NAME="asus-expertbook-sof-sdw"
PACKAGE_VERSION="3.0.1"
AUTOINSTALL="yes"

BUILT_MODULE_NAME[0]="snd-soc-sof-sdw"
DEST_MODULE_LOCATION[0]="/updates"

# No LLVM=1 here: DKMS appends it by itself when the target kernel was built
# with Clang (CachyOS ThinLTO kernels). Forcing it breaks GCC-built kernels
# such as linux-cachyos-lts 6.18.52 or stock Arch.
MAKE[0]="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"

# ASUS ExpertBook Ultra B9406CAA display workaround for a late xe reload.
# The installed kernel picks these up from the Limine cmdline, because xe
# loads from the initramfs before /etc/modprobe.d is read.
#
# enable_dpcd_backlight=2 forces the VESA AUX/DPCD brightness interface.
# enable_panel_replay=0 and enable_psr2_sel_fetch=0 match the cmdline.
# enable_psr is left at the kernel default (issue #7).
options xe enable_dpcd_backlight=2 enable_panel_replay=0 enable_psr2_sel_fetch=0

# ASUS ExpertBook Ultra B9406CAA display control.
#
# Force the VESA AUX/DPCD backlight interface: this panel can otherwise update
# the sysfs brightness value without changing its actual luminance.
#
# Run self-refresh as PSR1. Linux 7.2's default, Panel Replay with Selective
# Update, loses this panel's HDR colorimetry after every HDR modeset (washed out
# colors) and leaves stale content on screen, while disabling Panel Replay alone
# drops xe into PSR2 selective update over the DSC link, which paints red/green
# garbage on every update. enable_psr=1 alone leaves Panel Replay on, so both
# parameters are required.
options xe enable_dpcd_backlight=2 enable_panel_replay=0 enable_psr=1

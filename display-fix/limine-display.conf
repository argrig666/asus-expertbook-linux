# ASUS ExpertBook Ultra B9406CAA display parameters.
# Consumed by limine-entry-tool / limine-mkinitcpio-hook on CachyOS.
# PSR1 self-refresh: Linux 7.2's Panel Replay default washes out HDR after every
# HDR modeset and leaves stale content on this panel, and PSR2 selective update
# paints garbage over its DSC link. Both PSR parameters are needed (see
# display-fix/module.sh), plus the forced VESA DPCD backlight interface.
KERNEL_CMDLINE[default]+=" xe.enable_dpcd_backlight=2 xe.enable_panel_replay=0 xe.enable_psr=1"

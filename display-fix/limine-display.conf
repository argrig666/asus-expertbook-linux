# ASUS ExpertBook Ultra B9406CAA display workaround.
# Consumed by limine-entry-tool / limine-mkinitcpio-hook.
#
# xe.enable_dpcd_backlight=2 forces the VESA AUX/DPCD brightness interface.
# Without it, sysfs brightness changes while the panel luminance does not.
#
# xe.enable_panel_replay=0 is still required. Omarchy ships the same switch
# for this panel (install/hardware/asus/fix-asus-ptl-b9406-display.sh).
# Linux 7.2.3-arch1 did not retire it: boots that dropped the switch still
# froze. xe.enable_psr=0 does not cover Panel Replay, so it is not set here.
# xe.enable_psr2_sel_fetch=0 stays as well. Disabling Panel Replay alone
# falls back to PSR2 selective fetch, which has parked this panel in
# SU_STANDBY. See issue #7.
KERNEL_CMDLINE[default]+=" xe.enable_dpcd_backlight=2 xe.enable_panel_replay=0 xe.enable_psr2_sel_fetch=0"

# power-profile-bridge overrides. Everything is commented out: the built-in
# mapping picks, for each handler in /sys/class/platform-profile,
#
#   power-saver  -> low-power, else quiet, else cool, else balanced
#   balanced     -> balanced
#   performance  -> performance, else balanced-performance, else balanced
#
# Override one handler under one profile with
#   <profile>.<handler name>=<choice>
# where the handler name is /sys/class/platform-profile/*/name and the choice
# must be listed in that handler's `choices`. Changes apply on the next
# profile switch or `systemctl restart power-profile-bridge`.
#
# Keep the fans on the balanced curve in power-saver:
#   power-saver.asus-wmi=balanced
#
# Keep the SoC slider balanced in power-saver:
#   power-saver.SoC Power Slider=balanced
